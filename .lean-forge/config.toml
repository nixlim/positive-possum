# lean-forge configuration. Committed; read from the remote base tip, then HEAD.
# Per-developer model choices go in .lean-forge/local.toml (route model and effort only, uncommitted).

[gates]
# Named shell commands, run in order on every candidate. All must exit 0.
test = "uv run pytest -q"

[control]
# Paths whose changes get the binding review-final reviewer.
# triage/prompt.py is the frozen Mubit task prompt: any change forks the task and
# resets its kept-example count, so it gets the binding reviewer like a gate would.
# triage/llm.py builds the request shape, which forks the task the same way.
paths = [".lean-forge/", ".claude/", ".codex/", ".github/", "AGENTS.md", "CLAUDE.md", "tests/", "triage/prompt.py", "triage/llm.py"]

[review]
max_iterations = 8
autofix = true
focus = """
- The system prompt, output schema (output_config) and model for a repo are the Mubit task identity. They must be byte-identical across calls; anything that varies per call belongs in the user message (guidelines block). Flag any change to triage/prompt.py or to the request shape in triage/llm.py.
- Mubit is the only egress (hackathon rule: every LLM call goes through Mubit). Flag any client that could reach a provider directly, any second credential on the request, and any key in a log.
- Every model call must be logged to the store before scoring, including failures, with response headers, model_served and x-middleware-request-id. That log is the only evidence that Mubit switched the serving model.
- Metrics must exclude errored calls rather than score them as wrong, and agreement must only compare issues present in both runs.
- GitHub ingestion must drop pull requests, ignore bot actors in label events, keep the eval/train split deterministic, and never let ground-truth labels reach a prompt.
- On the Mubit starter credit some request options are refused; do not add request options without checking MUBIT_API_NOTES.md.
"""

[approval]
mode = "none"

[land]
remote = "origin"
branch = "main"
review = "none"

# review-cheap is the only review for paths outside [control].paths, usually most of the code.
[routes.review-cheap]
provider = "claude"
model = "claude-opus-5-5"
effort = "high"

[routes.review-final]
provider = "claude"
model = "claude-opus-5-5"
effort = "high"

[routes.fix]
provider = "claude"
model = "claude-opus-5-5"
effort = "high"

[routes.implement]
provider = "claude"
model = "claude-opus-5-5"
effort = "high"
