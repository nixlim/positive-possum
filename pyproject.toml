[project]
name = "mubit-triage"
version = "0.1.0"
description = "Issue tagging for OSS repos through Mubit, with an eval harness that detects when Mubit starts serving its adapter."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.2", # output_config and stop_reason "refusal"; the version tested and locked
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
triage = "triage.cli:main"

[dependency-groups]
dev = [
    "pylint>=3.3",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify,
# C90 mccabe complexity, PL pylint-style size limits (args, branches, statements).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C90", "PLR0912", "PLR0913", "PLR0915"]
ignore = ["E501"]  # line length is enforced by the formatter

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913"]

[tool.pylint.main]
# Only the module-size guard; everything else is ruff's job.
disable = "all"
enable = "too-many-lines"
max-module-lines = 400
