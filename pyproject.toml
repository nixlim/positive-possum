[project]
name = "mubit-triage"
version = "0.1.0"
description = "Issue tagging for OSS repos through Mubit, with an eval harness that detects when Mubit starts serving its adapter."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.2",  # output_config and stop_reason "refusal"; the version tested and locked
    "httpx>=0.27",
]

[project.scripts]
triage = "triage.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
